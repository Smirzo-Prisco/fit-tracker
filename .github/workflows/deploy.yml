name: Deploy Fit Tracker

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-fit-tracker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy su server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SSH_PATH }}
            # Preserva .env del backend prima del reset (non è in git)
            cp backend/.env /tmp/fit_tracker_env_backup 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fit_tracker_env_backup backend/.env 2>/dev/null || true

            # npm install è lento (registro remoto): saltalo se il lockfile non è cambiato dall'ultimo deploy
            install_se_serve() {
              local dir="$1"; shift
              local marker="$dir/.last-install-hash"
              local hash
              hash=$(sha256sum "$dir/package-lock.json" | cut -d' ' -f1)
              if [ -f "$marker" ] && [ "$(cat "$marker")" = "$hash" ] && [ -d "$dir/node_modules" ]; then
                echo "[$dir] dipendenze invariate, salto npm install"
              else
                (cd "$dir" && npm install "$@")
                echo "$hash" > "$marker"
              fi
            }

            install_se_serve ${{ secrets.SSH_PATH }}/backend --production
            cd ${{ secrets.SSH_PATH }}/backend
            pm2 restart fit-api || pm2 start server.js --name fit-api

            install_se_serve ${{ secrets.SSH_PATH }}/frontend
            cd ${{ secrets.SSH_PATH }}/frontend
            npm run build
